name: Import Stellar Screen Cinema assets
on:
  push:
    paths:
      - 'tmp/stellar-screen-cinema-transfer/READY'
permissions:
  contents: write
jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and commit assets
        shell: bash
        run: |
          set -euo pipefail
          cat tmp/stellar-screen-cinema-transfer/chunk*.b64 | tr -d '\n' | base64 -d > /tmp/stellar-screen-cinema-assets.zip
          echo "aaaac7749e64e90a1c5a53201cac41c6dcb2f41028195c13a774406e7b05bea6  /tmp/stellar-screen-cinema-assets.zip" | sha256sum -c -
          rm -rf /tmp/stellar-screen-cinema-extract
          mkdir -p /tmp/stellar-screen-cinema-extract
          unzip -q /tmp/stellar-screen-cinema-assets.zip -d /tmp/stellar-screen-cinema-extract
          rm -rf images/reconstructed-apps/stellar-screen-cinema
          mkdir -p images/reconstructed-apps/stellar-screen-cinema
          cp -a /tmp/stellar-screen-cinema-extract/stellar-screen-cinema/. images/reconstructed-apps/stellar-screen-cinema/
          rm -rf tmp/stellar-screen-cinema-transfer
          rm -f .github/workflows/repixel-stellar-screen-cinema-import.yml
          git config user.name "Repixel Asset Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Import Stellar Screen Cinema reconstructed assets [skip ci]"
          git push
