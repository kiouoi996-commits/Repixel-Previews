name: Repixel unpack Nora Harmony assets
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract media package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .repixel-tmp/unpacked
          mkdir -p .repixel-tmp/unpacked images/nora-harmony-furniture-ui
          unzip -o .repixel-tmp/nora-harmony-furniture-ui.zip -d .repixel-tmp/unpacked
          cp -a .repixel-tmp/unpacked/nora-harmony-furniture-ui/. images/nora-harmony-furniture-ui/
          rm -rf .repixel-tmp
          rm -f .github/workflows/repixel-unpack-nora.yml
      - name: Commit extracted assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Repixel Media Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add Nora Harmony furniture UI media assets"
          git push
