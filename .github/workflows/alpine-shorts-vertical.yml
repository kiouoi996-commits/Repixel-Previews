name: Build Alpine Ride vertical Shorts video
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/alpine-shorts-vertical.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render true 9x16 crop with unobstructed two-line headline
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          INPUT="videos/apps/alpine-ride-3d-2026-10-25-v2.mp4"
          OUTPUT="videos/apps/alpine-ride-shorts-cropped-9x16-2026-11-01.mp4"
          POSTER="images/alpine-ride-shorts-cropped-9x16-2026-11-01.jpg"
          test -f "$INPUT"
          mkdir -p images
          ffmpeg -y -i "$INPUT" -vf "scale=1080:1920:force_original_aspect_ratio=increase:flags=lanczos,crop=1080:1920,setsar=1,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='One prompt':fontcolor=0x0d2435:fontsize=50:x=(w-text_w)/2:y=22,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='GPT 6.1 Sol + Tripo3D':fontcolor=0x0d2435:fontsize=49:x=(w-text_w)/2:y=86" -map 0:v:0 -map 0:a? -c:v libx264 -preset fast -crf 19 -pix_fmt yuv420p -r 30 -movflags +faststart -c:a aac -b:a 128k "$OUTPUT"
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of default=noprint_wrappers=1 "$OUTPUT"
          ffmpeg -y -ss 5 -i "$OUTPUT" -frames:v 1 -q:v 2 "$POSTER"
      - name: Save edited Shorts video and poster
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos/apps/alpine-ride-shorts-cropped-9x16-2026-11-01.mp4 images/alpine-ride-shorts-cropped-9x16-2026-11-01.jpg
          git commit -m "media: place Shorts headline above app UI" || exit 0
          git push
