function renderHome(){const rows=Object.values(food).filter(f=>(state.category==='All'||state.category===f.category)&&(!state.onlySaved||state.saved.has(f.id))&&f.name.toLowerCase().includes(state.query.toLowerCase()));$('.products').innerHTML=rows.length?rows.map(f=>`<article class="product" data-id="${f.id}"><button class="food-open" data-open="${f.id}" aria-label="Open ${f.name}"><img src="https://raw.githubusercontent.com/kiouoi996-commits/Repixel-Previews/87585cd5abd6d766e97f8565ec1071d5b7ee148d/images/apps/hot-fresh-pizza-delivery-2026-10-26/${f.id}.webp" alt="${f.name}"></button><button class="heart" data-save="${f.id}" aria-label="Save ${f.name}" aria-pressed="${state.saved.has(f.id)}">${icon('heart')}</button><button class="product-name" data-open="${f.id}">${f.name}</button><strong class="product-price">${money(f.price)}</strong><button class="add" data-add="${f.id}" aria-label="Add ${f.name} to cart">${icon('plus')}</button></article>`).join(''):'<p class="no-results">No dishes found.</p>';$('.teasers').style.display=state.category==='Pizza'&&!state.onlySaved&&!state.query?'flex':'none';$$('[data-category]').forEach(x=>x.setAttribute('aria-selected',state.category===x.dataset.category));}
function renderCart(){const rows=Object.values(food).filter(f=>state.cart[f.id]>0);$('.cart-rows').innerHTML=rows.length?rows.map(f=>`<article class="cart-row" data-id="${f.id}"><div class="photo"><img src="https://raw.githubusercontent.com/kiouoi996-commits/Repixel-Previews/87585cd5abd6d766e97f8565ec1071d5b7ee148d/images/apps/hot-fresh-pizza-delivery-2026-10-26/${f.id}.webp" alt="${f.name}"></div><h2>${f.name}</h2><p class="description">${f.description}</p><strong class="price">${money(f.price)}</strong><div class="cart-quantity"><button data-cart-delta="-1" data-id="${f.id}" aria-label="Decrease ${f.name} quantity">${icon('minus')}</button><span class="cart-count">${state.cart[f.id]}</span><button data-cart-delta="1" data-id="${f.id}" aria-label="Increase ${f.name} quantity">${icon('plus')}</button></div></article>`).join(''):'<p class="empty-cart">Your cart is empty.</p>';const t=totals();$('.subtotal').textContent=money(t.subtotal);$('.delivery').textContent=money(t.delivery);$('.total-value').textContent=$('.checkout-total').textContent=money(t.total);$('.checkout').disabled=!t.total;}
function syncQuantity(){$('.detail-count').textContent=state.quantity;$('.detail-line-price').textContent=money(food[state.product].price*state.quantity);$('[data-detail-delta="-1"]').disabled=state.quantity===1;}
function show(route,animate=true){const old=$('.route.active'),next=$(`[data-route="${route}"]`);if(old===next)return;const reverse=route==='home';gsap.killTweensOf([old,next]);next.classList.add('active');next.inert=false;next.style.zIndex=3;old.style.zIndex=2;old.inert=true;if(animate&&!reduce){gsap.fromTo(next,{x:reverse?-440:440,opacity:1},{x:0,duration:.6,ease:'power3.inOut'});gsap.to(old,{x:reverse?75:-75,opacity:.76,duration:.6,ease:'power3.inOut',onComplete:()=>{old.classList.remove('active');gsap.set(old,{x:0,opacity:1})}})}else{old.classList.remove('active');gsap.set(next,{x:0,opacity:1})}state.previous=state.route;state.route=route;}
function openProduct(id){if(id==='cola'){state.cart.cola++;renderCart();toast('Added to cart');return;}state.product=id;state.quantity=1;$('.detail-name').textContent=food[id].name;$('.detail-price').textContent=money(food[id].price);$('.detail-copy').textContent=id==='margherita'?'tomato sauce, mozzarella & basil':'tomato sauce, mozzarella & pepperoni';$('.detail-hero').src='https://raw.githubusercontent.com/kiouoi996-commits/Repixel-Previews/87585cd5abd6d766e97f8565ec1071d5b7ee148d/images/apps/hot-fresh-pizza-delivery-2026-10-26/'+(id==='margherita'?'pizza-hero':'pepperoni')+'.webp';$('.detail-hero').alt=food[id].name;$('.ingredients').style.visibility=id==='margherita'?'visible':'hidden';$('.detail-heart').setAttribute('aria-pressed',state.saved.has(id));syncQuantity();show('details');}
function pulse(el){if(reduce)return;gsap.fromTo(el,{scale:.94},{scale:1,duration:.3,ease:'back.out(1.4)'})}
function toast(msg){$('.toast').textContent=msg;gsap.killTweensOf('.toast');gsap.to('.toast',{opacity:1,duration:reduce?0:.2});gsap.to('.toast',{opacity:0,duration:.25,delay:1.4})}
function save(id){state.saved.has(id)?state.saved.delete(id):state.saved.add(id);$('.detail-heart').setAttribute('aria-pressed',state.saved.has(state.product));renderHome()}
let overlayTrigger=null;function sheet(title,body){overlayTrigger=document.activeElement;$('#overlay').innerHTML=`<div class="backdrop"><section class="sheet" role="dialog" aria-modal="true" aria-label="${title}"><header><h2>${title}</h2><button class="close" data-action="close" aria-label="Close">${icon('close')}</button></header>${body}</section></div>`;$('.route.active').inert=true;$('.close').focus()}
function closeSheet(){$('#overlay').innerHTML='';$('.route.active').inert=false;if(overlayTrigger?.isConnected)overlayTrigger.focus()}
document.addEventListener('click',async e=>{await ready;const b=e.target.closest('button');if(!b)return;pulse(b);if(b.dataset.open){closeSheet();openProduct(b.dataset.open);return}if(b.dataset.add){state.cart[b.dataset.add]++;renderCart();toast('Added to cart');return}if(b.dataset.save){save(b.dataset.save);return}if(b.dataset.category){state.category=b.dataset.category;state.query='';state.onlySaved=false;renderHome();return}if(b.dataset.detailDelta){state.quantity=Math.max(1,Math.min(99,state.quantity+Number(b.dataset.detailDelta)));syncQuantity();return}if(b.dataset.cartDelta){const id=b.dataset.id;state.cart[id]=Math.max(0,Math.min(99,state.cart[id]+Number(b.dataset.cartDelta)));renderCart();return}switch(b.dataset.action){case'home':state.category='Pizza';state.onlySaved=false;state.query='';renderHome();break;case'favorites':state.onlySaved=!state.onlySaved;state.category='All';renderHome();break;case'cart':renderCart();show('cart');break;case'back':show(state.route==='details'?'home':state.previous==='details'?'details':'home');break;case'add-detail':state.cart[state.product]+=state.quantity;renderCart();show('cart');break;case'save-detail':save(state.product);break;case'all':state.category='All';state.query='';state.onlySaved=false;renderHome();break;case'clear-cart':state.cart={margherita:0,pepperoni:0,cola:0};renderCart();break;case'checkout':window.dispatchEvent(new CustomEvent('pizza:checkout-request',{detail:{items:Object.values(food).filter(f=>state.cart[f.id]).map(f=>({id:f.id,quantity:state.cart[f.id],unitPriceCents:f.price})),...totals()}}));toast('Ready to checkout');break;case'profile':window.dispatchEvent(new CustomEvent('pizza:profile-request'));toast('Profile selected');break;case'menu':sheet('Categories',['Pizza','Burger','Pasta','Salad','Drinks'].map(x=>`<button class="item" data-sheet-category="${x}">${x}</button>`).join(''));break;case'search':sheet('Search','<input type="search" id="menu-search" placeholder="Search dishes..." aria-label="Search dishes"><div id="search-results"></div>');$('#menu-search').focus();break;case'close':closeSheet();break;}if(b.dataset.sheetCategory){state.category=b.dataset.sheetCategory;state.onlySaved=false;state.query='';renderHome();closeSheet();}});
document.addEventListener('input',e=>{if(e.target.id==='menu-search'){state.query=e.target.value;$('#search-results').innerHTML=Object.values(food).filter(f=>f.name.toLowerCase().includes(state.query.toLowerCase())).map(f=>`<button class="item" data-open="${f.id}"><img src="https://raw.githubusercontent.com/kiouoi996-commits/Repixel-Previews/87585cd5abd6d766e97f8565ec1071d5b7ee148d/images/apps/hot-fresh-pizza-delivery-2026-10-26/${f.id}.webp" alt=""><span>${f.name} · ${money(f.price)}</span></button>`).join('')||'<p class="note">No dishes found.</p>'}});$('.promo').addEventListener('submit',e=>{e.preventDefault();const code=$('#promo').value.trim();if(!code){toast('Enter a promo code');return}window.dispatchEvent(new CustomEvent('pizza:promo-request',{detail:{code,...totals()}}));toast('Promo code not recognized')});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();if(e.key==='Tab'&&$('#overlay').children.length){const f=$$('button,input',$('.sheet'));if(e.shiftKey&&document.activeElement===f[0]){e.preventDefault();f.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===f.at(-1)){e.preventDefault();f[0].focus()}}if(['ArrowLeft','ArrowRight'].includes(e.key)&&e.target.matches('[data-category]')){const a=$$('[data-category]'),i=a.indexOf(e.target),b=a[(i+(e.key==='ArrowRight'?1:-1)+a.length)%a.length];e.preventDefault();b.focus();b.click()}});
function fit(){const app=new URLSearchParams(location.search).has('app');document.body.classList.toggle('app',app);const scale=app?Math.min(innerWidth/440,innerHeight/920):Math.min((innerHeight-70)/920,(innerWidth-80)/440);$('.frame').style.transform=`translate(-50%,-50%) scale(${scale})`}addEventListener('resize',fit);fit();
window.pizza={state,food,show,openProduct,totals,renderHome,renderCart,ready,reference:route=>{if(route==='cart'){state.cart={margherita:1,pepperoni:1,cola:1};renderCart()}show(route,false)}};
window.prepareFilm=async()=>{await ready;document.body.classList.add('film');state.cart={margherita:1,pepperoni:1,cola:1};renderCart();const home=$('.home'),details=$('.details'),cart=$('.cart-route'),tap=$('.tap');$$('.route').forEach(x=>{x.classList.add('active');x.style.visibility='visible'});gsap.set(home,{x:0,zIndex:3,opacity:1});gsap.set(details,{x:440,zIndex:4,opacity:1});gsap.set(cart,{x:440,zIndex:5,opacity:1});const tl=gsap.timeline({paused:true});function touch(x,y,t){tl.set(tap,{left:x,top:y,x:0,y:0,scale:.45,opacity:0},t).to(tap,{opacity:.8,scale:1,duration:.10},t).to(tap,{opacity:0,scale:1.55,duration:.28},t+.10)}
touch(112,668,1.10);tl.to(home,{x:-75,opacity:.76,duration:.6,ease:'power3.inOut'},1.30).to(details,{x:0,duration:.6,ease:'power3.inOut'},1.30).set(home,{visibility:'hidden'},1.90);
touch(117,843,2.15);tl.set('.detail-count',{textContent:'2'},2.29).set('.detail-line-price',{textContent:'$17.80'},2.29);touch(53,843,2.72);tl.set('.detail-count',{textContent:'1'},2.86).set('.detail-line-price',{textContent:'$8.90'},2.86);
touch(285,843,3.27);tl.to(details,{x:-75,opacity:.76,duration:.6,ease:'power3.inOut'},3.46).to(cart,{x:0,duration:.6,ease:'power3.inOut'},3.46).set(details,{visibility:'hidden'},4.06);
const colaCount=$('.cart-row[data-id=cola] .cart-count');touch(386,553,5.05);tl.set(colaCount,{textContent:'2'},5.20).set('.subtotal',{textContent:'$23.40'},5.20).set('.total-value',{textContent:'$26.40'},5.20).set('.checkout-total',{textContent:'$26.40'},5.20);touch(314,553,5.75);tl.set(colaCount,{textContent:'1'},5.90).set('.subtotal',{textContent:'$20.90'},5.90).set('.total-value',{textContent:'$23.90'},5.90).set('.checkout-total',{textContent:'$23.90'},5.90);
touch(220,850,6.58);tl.to('.checkout',{scale:.97,duration:.10},6.68).to('.checkout',{scale:1,duration:.25,ease:'back.out(1.3)'},6.78).set('.toast',{textContent:'Ready to checkout'},6.85).to('.toast',{opacity:1,duration:.2},6.85).to('.toast',{opacity:0,duration:.25},7.40);tl.set(home,{visibility:'visible',zIndex:7,x:0,opacity:0},7.70).to(home,{opacity:1,duration:.6,ease:'power2.inOut'},7.70);window.filmTimeline=tl;window.renderAt=t=>{tl.time(t,false)};renderAt(0)};
</script></body></html>
