function cartTotal(){return Object.entries(state.cart).reduce((a,[id,n])=>a+products.find(d=>d.id===id).cents*n,0)}
function addCurrent(){if(state.busy)return;addOne(state.active);const to=seriesIds.includes(state.active)?'series':'catalog',c=config('detail',to,state.active);if(matchMedia('(prefers-reduced-motion:reduce)').matches){runMotion(c);return}state.busy=true;semantics();gsap.to('.actor-action',{scale:.95,duration:.1,ease:'power2.in',onComplete:()=>{state.busy=false;runMotion(c,1.05);gsap.to('.actor-action',{scale:1,duration:.4,ease:'back.out(2)'})}})}
function openPanel(kind){if(state.busy)return;panelFocus=document.activeElement;$('.overlay').classList.add('open');$('.overlay').style.display='flex';$('.overlay').setAttribute('aria-label',kind==='search'?'Search':kind==='cart'?'Cart':'Menu');const close=`<button class="panel-close" aria-label="Close ${kind}">${icon('close')}</button>`;if(kind==='menu')$('.panel').innerHTML=close+'<h2>Explore</h2><button class="menu-link" data-menu="all">All shoes</button><button class="menu-link" data-menu="series">Air Max Series</button><button class="menu-link" data-menu="saved">Saved shoes</button>';else if(kind==='search')$('.panel').innerHTML=close+'<h2>Search</h2><input class="search-input" type="search" aria-label="Search the shoe catalog" placeholder="Search shoes"><div class="search-results"></div>';else{$('.panel').innerHTML=close+'<h2>Your Cart</h2><div class="cart-items"></div><div class="cart-total"><span>Total</span><span class="total-value"></span></div><p class="empty-message"></p><button class="checkout">Continue</button>';renderCart()}$('.panel-close').onclick=closePanel;$$('[data-menu]').forEach(el=>el.onclick=()=>{const action=el.dataset.menu;closePanel();if(action==='series')goSeries();else{state.category='All';state.savedOnly=action==='saved';renderCatalog()}});if(kind==='search'){const field=$('.search-input');field.oninput=renderSearch;renderSearch();field.focus()}else $('.panel-close').focus()}
function closePanel(){$('.overlay').classList.remove('open');$('.overlay').style.display='none';panelFocus?.focus({preventScroll:true})}
function renderSearch(){const query=$('.search-input').value.trim().toLowerCase(),ids=products.map((d,i)=>i).filter(i=>products[i].name.toLowerCase().includes(query));$('.search-results').innerHTML=ids.length?ids.map(i=>`<button class="search-result" data-search-product="${i}"><img src="https://raw.githubusercontent.com/kiouoi996-commits/Repixel-Previews/b7e1dfccf905e73ffc58ac106d93e48bf1849d36/images/apps/air-max-shoe-store-2026-10-26/${products[i].asset}.webp" alt=""><span>${products[i].name}<small>${money(products[i].cents)}</small></span></button>`).join(''):'<p class="empty-message">No matching shoes</p>';$$('[data-search-product]').forEach(el=>el.onclick=()=>{const i=+el.dataset.searchProduct;closePanel();state.category='All';state.savedOnly=false;renderCatalog();const r=[0,1,2,3].includes(i)?'catalog':'series';stable(r,i);const tile=$(`.${r} [data-product="${i}"]`),strip=tile.closest('.featured-strip,.series-strip');if(strip)strip.scrollLeft=tile.offsetLeft;openProduct(r,i)})}
function renderCart(){const entries=Object.entries(state.cart);$('.cart-items').innerHTML=entries.map(([id,n])=>{const d=products.find(p=>p.id===id);return `<div class="cart-row"><img class="cart-photo" src="https://raw.githubusercontent.com/kiouoi996-commits/Repixel-Previews/b7e1dfccf905e73ffc58ac106d93e48bf1849d36/images/apps/air-max-shoe-store-2026-10-26/${d.asset}.webp" alt=""><span class="cart-copy">${d.name}<small>${money(d.cents)}</small></span><div class="cart-quantity"><button data-cart="${id}" data-delta="-1" aria-label="Decrease ${d.name} quantity">${icon('minus')}</button><span>${n}</span><button data-cart="${id}" data-delta="1" aria-label="Increase ${d.name} quantity" ${n>=99?'disabled':''}>${icon('plus')}</button></div></div>`}).join('');$('.total-value').textContent=money(cartTotal());$('.empty-message').textContent=entries.length?'':'Your cart is empty';$('.checkout').disabled=!entries.length;$$('[data-cart]').forEach(el=>el.onclick=()=>{const id=el.dataset.cart,delta=el.dataset.delta;state.cart[id]+=+delta;if(!state.cart[id])delete state.cart[id];updateCart();renderCart();const next=$(`[data-cart="${id}"][data-delta="${delta}"]`);(next&&!next.disabled?next:$('.panel-close')).focus()});$('.checkout').onclick=()=>{window.dispatchEvent(new CustomEvent('sneakers:checkout-request',{detail:{items:Object.entries(state.cart).map(([id,quantity])=>({id,quantity,unitCents:products.find(p=>p.id===id).cents})),totalCents:cartTotal()}}));closePanel();notify('Cart ready')}}
$('.overlay').addEventListener('click',e=>{if(e.target===$('.overlay'))closePanel()});document.addEventListener('keydown',e=>{if(!$('.overlay').classList.contains('open'))return;if(e.key==='Escape'){closePanel();return}if(e.key==='Tab'){const els=[...$('.panel').querySelectorAll('button:not(:disabled),input')];if(e.shiftKey&&document.activeElement===els[0]){e.preventDefault();els.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===els.at(-1)){e.preventDefault();els[0].focus()}}});
$('.categories').innerHTML=['All','Running','Basketball','Lifestyle','Training'].map(n=>`<button class="category ${n==='All'?'active':''}" data-category="${n}" aria-pressed="${n==='All'}">${n}</button>`).join('');$$('[data-category]').forEach(el=>el.onclick=()=>{state.category=el.dataset.category;state.savedOnly=false;renderCatalog()});$('.menu').onclick=()=>openPanel('menu');$('.search').onclick=()=>openPanel('search');$('.basket').onclick=()=>openPanel('cart');$('.series-back').onclick=seriesBack;$('.detail-back').onclick=back;$('.actor-action').onclick=addCurrent;$('.banner-open').onclick=openBanner;$('.previous').onclick=()=>swipe(-1);$('.next').onclick=()=>swipe(1);$('.favorite').onclick=()=>{const id=products[state.active].id;if(state.saved.has(id))state.saved.delete(id);else state.saved.add(id);updateFavorite()};
function reference(route='catalog',index=0,seriesFixture=false){if(motion)motion.kill();gsap.killTweensOf('.actor-action');state.busy=false;state.origin={route:'catalog',mode:'card'};if(seriesFixture){state.cart={pulse:2};updateCart()}stable(route,index)}
function resize(){const s=Math.min(innerWidth/W,innerHeight/H,...(location.search.includes('app')?[]:[1]));$('.frame').style.width=W*s+'px';$('.frame').style.height=H*s+'px';$('.frame').style.borderRadius=location.search.includes('app')?'0':44*s+'px';set($('.app'),{transformOrigin:'0 0',transform:`scale(${s})`})}if(location.search.includes('app'))document.body.classList.add('app-mode');addEventListener('resize',resize);resize();renderCatalog();renderSeries();reference();updateCart();
function prepareFilm(){state.film=true;state.category='All';state.savedOnly=false;renderCatalog();renderSeries();$('.featured-strip').scrollLeft=0;$('.series-strip').scrollLeft=0;const cs={open:config('catalog','detail',0),close:config('detail','series',0),banner:config('series','detail',0,'banner'),reverse:config('detail','series',0,'banner-reverse'),return:config('series','catalog',0)};const ease=gsap.parseEase('power3.inOut'),swipeEase=gsap.parseEase('power3.inOut');function base(r,i,t){state.busy=false;state.cart=t<5.8?{}:t<7.5?{pulse:1}:{pulse:2};updateCart();stable(r,i);$('.toast').style.visibility='hidden';$$('.card-action').forEach(el=>el.style.transform='scale(1)')}
window.renderAt=t=>{if(t<.6)base('catalog',0,t);else if(t<1.65){base('catalog',0,t);renderMotion(cs.open,ease((t-.6)/1.05))}else if(t<2.25)base('detail',0,t);else if(t<3.10){base('detail',0,t);applySwipe(swipeEase((t-2.25)/.85),0,4,1)}else if(t<3.4)base('detail',4,t);else if(t<4.25){base('detail',4,t);applySwipe(swipeEase((t-3.4)/.85),4,5,1)}else if(t<4.55)base('detail',5,t);else if(t<5.40){base('detail',5,t);applySwipe(swipeEase((t-4.55)/.85),5,0,1)}else if(t<5.8){base('detail',0,t);if(t>5.65)$('.actor-action').style.transform=`scale(${1-.05*Math.sin((t-5.65)/.15*Math.PI)})`}else if(t<6.85){base('detail',0,t);renderMotion(cs.close,ease((t-5.8)/1.05))}else if(t<8.1){base('series',0,t);if(t>=7.5&&t<7.9){const el=$('.series [data-product="0"] .card-action');el.style.transform=`scale(${1-.13*Math.sin((t-7.5)/.4*Math.PI)})`}}else if(t<9.25){base('series',0,t);renderMotion(cs.banner,ease((t-8.1)/1.15))}else if(t<10.1)base('detail',0,t);else if(t<11.25){base('detail',0,t);renderMotion(cs.reverse,ease((t-10.1)/1.15))}else if(t<11.6)base('series',0,t);else if(t<12.55){base('series',0,t);renderMotion(cs.return,ease((t-11.6)/.95))}else base('catalog',0,t)};renderAt(0);return true}
window.shoeApp={state,reference,openProduct,swipe,back,openBanner,goSeries};window.prepareFilm=prepareFilm;
Promise.all([document.fonts.ready,...$$('img').map(img=>img.decode().catch(()=>{}))]).then(()=>{$('.app').inert=false;$('.app').setAttribute('aria-busy','false');window.appReady=true});
