<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Water Drop Wave · Repixel</title><style>
@font-face{font-family:Inter;src:url(https://raw.githubusercontent.com/kiouoi996-commits/Repixel-Previews/d4256c6ca9d175defe67e3c4965a2d1bfa0f1114/fonts/app-assets/pulse-go-next-place-2026-09-30/Inter-Latin.woff) format("woff");font-weight:100 900;font-display:swap}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#08190f;font-family:Inter,system-ui,sans-serif;font-optical-sizing:none;font-variation-settings:"opsz" 14}
.stage{width:min(82vw,821.25px);aspect-ratio:365/81;position:relative}
button{width:100%;height:100%;border:0;padding:0;background:none;border-radius:7.397%/33.333%;cursor:pointer;display:block;touch-action:manipulation;color:#f1f5e9}
button:focus-visible{outline:3px solid #eaffcb;outline-offset:6px}button:disabled{cursor:default;opacity:.55}
svg{display:block;width:100%;height:100%;overflow:visible}text{font-family:Inter,system-ui,sans-serif;font-variation-settings:"opsz" 14}
</style></head><body><div class="stage">
<button id="care" aria-label="Water your plants, 3 plants need attention">
<svg viewBox="0 0 365 81" aria-hidden="true"><defs>
<linearGradient id="surface" x1="0" x2="1" y1="0" y2=".2"><stop stop-color="#3a501e"/><stop offset=".52" stop-color="#263c22"/><stop offset="1" stop-color="#15291e"/></linearGradient>
<linearGradient id="contour"><stop stop-color="#768f3f"/><stop offset="1" stop-color="#263c28"/></linearGradient><clipPath id="drop"><path d="M12 2.7c-3.5 5-7 8.4-7 12a7 7 0 0 0 14 0c0-3.6-3.5-7-7-12Z"/></clipPath></defs>
<rect width="365" height="81" rx="27" fill="url(#surface)" stroke="url(#contour)" stroke-width="1"/><circle cx="38.5" cy="40.5" r="23.5" fill="#49632e"/>
<g transform="translate(26 28) scale(1.0416667)"><g clip-path="url(#drop)"><path id="liquid" fill="#b4f580"/><circle id="bubble1" fill="#ebffc9" r=".7"/><circle id="bubble2" fill="#ebffc9" r=".7"/></g><path d="M12 2.7c-3.5 5-7 8.4-7 12a7 7 0 0 0 14 0c0-3.6-3.5-7-7-12Z" fill="none" stroke="#c0f58c" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="77" y="35" font-size="18" font-weight="600" fill="#f1f5e9">Water your plants</text><text x="77" y="60" font-size="14" fill="#bdc8ac">3 plants need attention</text>
<g id="disc"><circle cx="327" cy="41" r="23" fill="#b0f57b"/></g><g id="arrow" stroke="#193e24" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M321.5 41h11m-5-5 5 5-5 5"/></g></svg>
</button></div><script>
const care=document.querySelector('#care'),liquid=document.querySelector('#liquid'),arrow=document.querySelector('#arrow'),disc=document.querySelector('#disc'),reduced=matchMedia('(prefers-reduced-motion:reduce)');
let hovered=false,focused=false,active=false,level=0,target=0,last=performance.now(),phase=0,raf=0,demoRaf=0,pressed=false,activations=0;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
function paint(p,cycle=0,press=0){
 const y=20.4-11.3*p,amp=.25+.8*p;
 let d='M3 '+(y+amp*Math.sin(3*.68-cycle));
 for(let i=1;i<=110;i++){const x=3+18*i/110;d+='L'+x+' '+(y+amp*Math.sin(x*.68-cycle));}
 liquid.setAttribute('d',d+'L21 24H3Z');
 for(const [i,x,by] of [[1,9.2,16.5],[2,14.8,18.1]]){const b=document.querySelector('#bubble'+i);b.setAttribute('cx',x);b.setAttribute('cy',by-(cycle%(2*Math.PI))*1.1);b.setAttribute('opacity',p);b.setAttribute('r',.7*p);}
 arrow.setAttribute('transform','translate('+(2.8*p-.7*press)+' 0)');
 disc.setAttribute('transform','translate(327 41) scale('+(1-.07*press)+') translate(-327 -41)');
}
function tick(now){const dt=Math.min(40,now-last);last=now;const step=dt/(target>level?650:600);level=target>level?Math.min(target,level+step):Math.max(target,level-step);if(active)phase+=dt/1650*2*Math.PI;paint(level,phase,pressed?1:0);if(active||Math.abs(level-target)>.001)raf=requestAnimationFrame(tick);else raf=0;}
function begin(){active=true;target=reduced.matches?0:1;last=performance.now();if(!raf&&!reduced.matches)raf=requestAnimationFrame(tick);}
function end(){active=false;target=0;pressed=false;last=performance.now();if(!raf&&!reduced.matches)raf=requestAnimationFrame(tick);if(reduced.matches)paint(0);}
function refresh(){if(hovered||focused)begin();else end();}
care.addEventListener('pointerenter',()=>{hovered=true;refresh()});care.addEventListener('pointerleave',()=>{hovered=false;refresh()});care.addEventListener('focus',()=>{focused=true;refresh()});care.addEventListener('blur',()=>{focused=false;refresh()});
care.addEventListener('pointerdown',()=>{pressed=true;begin()});care.addEventListener('pointerup',()=>{pressed=false;refresh()});care.addEventListener('pointercancel',()=>{hovered=false;pressed=false;refresh()});
care.addEventListener('click',()=>{care.dataset.activationCount=String(++activations);care.dispatchEvent(new CustomEvent('care-attention-request',{bubbles:true,detail:{fixture:true}}));});
reduced.addEventListener('change',()=>{cancelAnimationFrame(raf);cancelAnimationFrame(demoRaf);raf=0;level=0;target=0;paint(0);});
paint(0);
if(new URLSearchParams(location.search).get('demo')==='1'&&!reduced.matches){
 cancelAnimationFrame(raf);const origin=performance.now();const ease=x=>{x=clamp(x);return x*x*(3-2*x)};
 function demo(now){const t=((now-origin)/1000)%6;let p=0,c=0,press=0;
 if(t>=.65&&t<2.3){p=ease((t-.65)/.65);c=(t-.65)/1.65;}
 else if(t<2.9&&t>=2.3){p=1-ease((t-2.3)/.6);c=1;}
 else if(t>=3.45&&t<4.95){p=ease((t-3.45)/.55);c=(t-3.45)/1.5;if(t>4.2&&t<4.42)press=Math.sin(Math.PI*clamp((t-4.2)/.22));}
 else if(t>=4.95&&t<5.65){p=1-ease((t-4.95)/.7);c=1;}
 paint(p,c*2*Math.PI,press);demoRaf=requestAnimationFrame(demo);}
 demoRaf=requestAnimationFrame(demo);
}
</script></body></html>
