const svg=document.querySelector('#scene'),slider=document.querySelector('input'),rw=document.querySelector('#reveal-width'),marker=document.querySelector('#marker'),badge=document.querySelector('#badge'),reduced=matchMedia('(prefers-reduced-motion:reduce)');
const points=[[0,69.5],[4,65.5],[8,61.5],[12,62],[16,62.5],[20,58.5],[24,54.5],[28,51],[32,49.5],[36,46.5],[40,46.5],[44,48.5],[48,50],[52,53],[56,53.5],[60,57],[64,57],[68,56.5],[72,55.5],[76,54],[80,52],[84,49.5],[88,48.5],[92,45],[96,42.5],[100,40.5],[104,41],[108,42],[112,41],[116,39.5],[120,37],[124,33.5],[128,30.5],[132,28],[136,26.5],[140,24],[144,23.5],[148,24],[152,23.5],[156,20.5],[160,16.5],[164,14],[168,14],[172,13.5],[176,11.5],[180,10],[184,11],[188,11.5],[192,12],[196,13.5],[200,15.5],[204,16],[208,15.5],[212,15.5],[216,16.5],[220,18.5],[224,19],[228,23],[232,26.5],[236,29.5],[240,33.5],[244,36.5],[248,38],[252,40],[256,41],[260,41],[264,40],[268,40],[272,42],[276,45.5],[280,49.5],[284,52.5],[288,53.5],[292,54.5],[296,56.5],[300,60.5],[304,61],[308,62]],clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));let focus=false,hover=false,selected=null,drawRaf=0,demoRaf=0;
function reveal(v){rw.setAttribute('width',312*clamp(v));}
function select(value){if(value===null){marker.setAttribute('opacity',0);badge.setAttribute('opacity',0);return;}const px=308*clamp(value/8.4),i=Math.min(points.length-2,Math.floor(px/4)),[a,b]=points[i],[c,d]=points[i+1],py=b+(d-b)*(px-a)/(c-a);
marker.setAttribute('opacity',1);badge.setAttribute('opacity',1);document.querySelector('#crosshair').setAttribute('d','M'+px+' 0V78');for(const id of ['#dot','#dot-bg']){document.querySelector(id).setAttribute('cx',px);document.querySelector(id).setAttribute('cy',py);}
badge.setAttribute('transform','translate('+Math.max(27,Math.min(285,px))+' 0)');document.querySelector('#distance').textContent=value.toFixed(1)+' km';slider.setAttribute('aria-valuetext',value.toFixed(1)+' kilometers, visual reference position');}
function intro(){cancelAnimationFrame(drawRaf);if(reduced.matches){reveal(1);return;}const start=performance.now();function tick(now){let t=clamp((now-start)/900);reveal(t*t*(3-2*t));if(t<1)drawRaf=requestAnimationFrame(tick);}drawRaf=requestAnimationFrame(tick);}
svg.addEventListener('pointermove',e=>{if(e.pointerType==='touch'&&e.buttons===0)return;const r=svg.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*416,y=(e.clientY-r.top)/r.height*200;if(x<81||x>393||y<65||y>143){hover=false;if(!focus)select(null);return;}hover=true;selected=clamp((x-81)/308)*8.4;slider.value=selected.toFixed(1);select(selected)});
svg.addEventListener('pointerdown',e=>{const r=svg.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*416,y=(e.clientY-r.top)/r.height*200;if(x>=81&&x<=393&&y>=65&&y<=143){selected=clamp((x-81)/308)*8.4;slider.value=selected.toFixed(1);select(selected);}});
svg.addEventListener('pointerleave',()=>{hover=false;if(!focus)select(null);});
slider.addEventListener('focus',()=>{focus=true;select(Number(slider.value))});slider.addEventListener('blur',()=>{focus=false;if(!hover)select(null)});slider.addEventListener('input',()=>{selected=Number(slider.value);select(selected);});
reduced.addEventListener('change',()=>{cancelAnimationFrame(drawRaf);cancelAnimationFrame(demoRaf);reveal(1);select(null);});intro();
if(new URLSearchParams(location.search).get('demo')==='1'&&!reduced.matches){cancelAnimationFrame(drawRaf);const origin=performance.now(),ease=x=>{x=clamp(x);return x*x*(3-2*x)};
function demo(now){const t=((now-origin)/1000)%6;let r=0,m=null;if(t>=.6&&t<1.5)r=ease((t-.6)/.9);else if(t>=1.5&&t<5.25)r=1;else if(t>=5.25&&t<5.75)r=1-ease((t-5.25)/.5);if(t>=1.9&&t<4.7)m=(t-1.9)/2.8*8.4;reveal(r);select(m);demoRaf=requestAnimationFrame(demo);}demoRaf=requestAnimationFrame(demo);}
