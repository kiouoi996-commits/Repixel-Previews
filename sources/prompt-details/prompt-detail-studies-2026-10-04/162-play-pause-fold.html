<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Play pause fold</title>
<style>
@font-face{font-family:Inter;src:url('https://raw.githubusercontent.com/kiouoi996-commits/Repixel-Previews/d4256c6ca9d175defe67e3c4965a2d1bfa0f1114/fonts/app-assets/pulse-go-next-place-2026-09-30/Inter-Latin.woff')}*{box-sizing:border-box}body{margin:0;background:white;min-height:100svh;display:grid;place-items:center;font-family:Inter,system-ui,sans-serif}.stage{position:relative;width:1080px;height:608px;transform-origin:center}.strip{position:absolute;left:94px;top:148px;width:892px;height:312px;border-radius:36px;background:#f5f9ff}.toggle{position:absolute;left:301px;top:11px;width:290px;height:290px;background:linear-gradient(135deg,#2879ff,#1452ee);border-radius:50%;border:0;cursor:pointer;padding:0;color:#fdfeff}.toggle svg{display:block;width:100%;height:100%;overflow:visible}.toggle:focus-visible{outline:4px solid #26354a;outline-offset:8px}.toggle:disabled{cursor:wait}.neighbor{position:absolute;top:139px;width:48px;height:34px;color:#758499}.previous{left:192px}.next{right:192px}.sample{position:absolute;top:490px;width:100%;text-align:center;font-size:14px;color:#758499;margin:0}.status{position:absolute;top:523px;width:100%;text-align:center;font-size:14px;color:#6e4054;margin:0}.visually-hidden{position:absolute;clip-path:inset(50%);height:1px;width:1px;overflow:hidden}
</style>
<main class="stage" aria-label="Play pause control"><div class="strip"><svg class="neighbor previous" viewBox="0 0 48 34" aria-hidden="true"><path d="M6 1v32M11 17 41 1v32Z" fill="currentColor" stroke="currentColor" stroke-width="3"/></svg><button class="toggle" aria-label="Play sample audio" aria-pressed="false"><svg viewBox="0 0 145 145" aria-hidden="true"><g fill="currentColor"><polygon id="left"/><polygon id="right"/></g></svg></button><svg class="neighbor next" viewBox="0 0 48 34" aria-hidden="true"><path d="M42 1v32M37 17 7 1v32Z" fill="currentColor" stroke="currentColor" stroke-width="3"/></svg></div><audio preload="metadata"></audio><p class="sample">Sample audio</p><p class="status" role="status" aria-live="polite"></p></main>
<script>
const stage=document.querySelector('.stage'),button=document.querySelector('button'),audio=document.querySelector('audio'),status=document.querySelector('.status'),motion=matchMedia('(prefers-reduced-motion: reduce)'),parts=[document.querySelector('#left'),document.querySelector('#right')];let value=0,target=0,frame=0,pending=false,dead=false,demo=false,demoFrame=0;
// Self-contained authored sample; production integration supplies real host media.
const rate=22050,count=Math.round(rate*4.5),wav=new ArrayBuffer(44+count*2),data=new DataView(wav);function ascii(at,s){for(let i=0;i<s.length;i++)data.setUint8(at+i,s.charCodeAt(i))}ascii(0,'RIFF');data.setUint32(4,36+count*2,true);ascii(8,'WAVE');ascii(12,'fmt ');data.setUint32(16,16,true);data.setUint16(20,1,true);data.setUint16(22,1,true);data.setUint32(24,rate,true);data.setUint32(28,rate*2,true);data.setUint16(32,2,true);data.setUint16(34,16,true);ascii(36,'data');data.setUint32(40,count*2,true);for(let i=0;i<count;i++){const t=i/rate,fade=Math.min(1,t/.35,(4.5-t)/.6),sample=(Math.sin(2*Math.PI*264*t)+.4*Math.sin(2*Math.PI*396*t))*.035*Math.max(0,fade);data.setInt16(44+i*2,Math.round(sample*32767),true)}const sampleURL=URL.createObjectURL(new Blob([wav],{type:'audio/wav'}));audio.src=sampleURL;
const play=[[[-17,-24],[0,-13],[0,13],[-17,24]],[[0,-13],[26,0],[0,13],[0,13]]],pause=[[[-17,-24],[-6,-24],[-6,24],[-17,24]],[[6,-24],[17,-24],[17,24],[6,24]]];
function fit(){stage.style.transform=`scale(${Math.min(innerWidth/1080,innerHeight/608,1)})`}addEventListener('resize',fit);fit();
function paint(p){value=p;const fold=Math.sin(Math.PI*p);parts.forEach((el,i)=>el.setAttribute('points',play[i].map((a,j)=>`${72.5+a[0]+(pause[i][j][0]-a[0])*p+(i?1:-1)*3.5*fold},${72.5+a[1]+(pause[i][j][1]-a[1])*p+([-1,1,1,-1][j])*2.5*fold}`).join(' ')))}
function transition(next){target=next;cancelAnimationFrame(frame);if(motion.matches){paint(next);return}const from=value,start=performance.now();function step(now){const x=Math.min(1,(now-start)/360),e=x*x*(3-2*x);paint(from+(next-from)*e);if(x<1)frame=requestAnimationFrame(step)}frame=requestAnimationFrame(step)}
function sync(){if(demo)return;const playing=!audio.paused&&!audio.ended;button.setAttribute('aria-label',playing?'Pause sample audio':'Play sample audio');button.setAttribute('aria-pressed',String(playing));transition(playing?1:0)}
function stopDemo(){demo=false;cancelAnimationFrame(demoFrame);document.querySelector('.sample').textContent='Sample audio';sync()}
async function toggle(){if(demo)stopDemo();if(pending)return;status.textContent='';if(!audio.paused){audio.pause();return}if(audio.error){status.textContent='Sample audio unavailable';return}pending=true;button.disabled=true;try{await audio.play()}catch(e){if(!dead)status.textContent='Playback could not start. Try again.'}finally{pending=false;if(!dead){button.disabled=false;sync()}}}
button.addEventListener('click',toggle);const listeners={play:sync,pause:sync,ended:sync,emptied:sync,waiting:()=>status.textContent='Loading audio…',canplay:()=>status.textContent='',error:()=>{status.textContent='Sample audio unavailable';sync()}};Object.entries(listeners).forEach(([event,fn])=>audio.addEventListener(event,fn));
motion.addEventListener('change',()=>{cancelAnimationFrame(frame);if(motion.matches&&demo)stopDemo();paint(target)});paint(0);
// Explicit visual fixture; clicking exits it and starts the real HTMLAudioElement.
if(new URLSearchParams(location.search).get('demo')==='1'&&!motion.matches){demo=true;document.querySelector('.sample').textContent='Animation preview';const start=performance.now();function replay(now){const t=((now-start)/1000)%6,next=t>=.65&&t<2.7||t>=3.7&&t<5.02?1:0;if(next!==target)transition(next);demoFrame=requestAnimationFrame(replay)}demoFrame=requestAnimationFrame(replay)}
addEventListener('pagehide',()=>{dead=true;cancelAnimationFrame(frame);cancelAnimationFrame(demoFrame);Object.entries(listeners).forEach(([event,fn])=>audio.removeEventListener(event,fn));audio.pause();URL.revokeObjectURL(sampleURL)});
</script></html>
