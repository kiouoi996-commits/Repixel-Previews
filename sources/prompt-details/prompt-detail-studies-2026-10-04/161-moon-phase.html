<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moon phase detail</title>
<style>
@font-face{font-family:Inter;src:url('https://raw.githubusercontent.com/kiouoi996-commits/Repixel-Previews/d4256c6ca9d175defe67e3c4965a2d1bfa0f1114/fonts/app-assets/pulse-go-next-place-2026-09-30/Inter-Latin.woff')}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:#191d13;font-family:Inter,system-ui,sans-serif}.stage{position:relative;width:1080px;height:608px;transform-origin:center}.disc{position:absolute;left:388px;top:103px;width:304px;height:304px;touch-action:pan-y;cursor:ew-resize}.disc img{display:none}.phase-label{position:absolute;top:438px;left:0;width:100%;color:#d8dfcb;font-size:23px;font-weight:500;text-align:center;margin:0}.range-wrap{position:absolute;left:370px;top:485px;width:340px;color:#929d81}.range-wrap input{width:100%;accent-color:#dde6cf;cursor:ew-resize}.endpoints{display:flex;justify-content:space-between;font-size:15px;margin-top:13px}.help{position:absolute;clip-path:inset(50%);width:1px;height:1px;overflow:hidden}input:focus-visible{outline:2px solid #d8dfcb;outline-offset:7px}.error{color:#dfb29b}
</style>
<main class="stage" aria-label="Decorative moon phase study"><canvas class="disc" width="608" height="608" aria-hidden="true"></canvas><img id="texture" alt="" crossorigin="anonymous" hidden src="https://raw.githubusercontent.com/kiouoi996-commits/Repixel-Previews/2b1259331a9c7fbd5124ee72dd479406a9a71102/images/editorial/references/123-more-than-places-arch-aperture-2026-09-30-a1-reference.webp"><p class="phase-label" aria-hidden="true">Full moon</p><label class="range-wrap"><span class="help">Moon shadow, decorative phase</span><input type="range" min="0" max="100" step="1" value="0" aria-valuetext="Full moon"><span class="endpoints" aria-hidden="true"><span>Full</span><span>Crescent</span></span></label><p id="description" class="help">Move the pointer across the moon, drag on touch, or adjust the slider with arrow keys. This is a decorative light mask.</p></main>
<script>
const stage=document.querySelector('.stage'),canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),texture=document.querySelector('#texture'),range=document.querySelector('input'),label=document.querySelector('.phase-label'),motion=matchMedia('(prefers-reduced-motion: reduce)');let source,phase=0,frame=0,drag=false;
range.setAttribute('aria-describedby','description');function fit(){stage.style.transform=`scale(${Math.min(innerWidth/1080,innerHeight/608,1)})`}addEventListener('resize',fit);fit();
function name(p){return p<.03?'Full moon':p<.48?'Gibbous':p<.64?'Half moon':'Crescent'}
function draw(p){phase=Math.max(0,Math.min(1,p));range.value=String(Math.round(phase*100));const title=name(phase);label.textContent=title;range.setAttribute('aria-valuetext',title);if(!source)return;const image=new ImageData(new Uint8ClampedArray(source.data),608,608),r=304;for(let y=0;y<608;y++){const yy=(y+.5)-r,chord=Math.sqrt(Math.max(0,r*r-yy*yy)),edge=(-1+1.8*phase)*chord;for(let x=0;x<608;x++){const xx=x+.5-r,i=(y*608+x)*4;if(xx*xx+yy*yy>r*r){image.data[i+3]=0;continue}const lit=Math.max(0,Math.min(1,(xx-edge)/2.2+.5)),brightness=.10+.90*lit;image.data[i]*=brightness;image.data[i+1]*=brightness;image.data[i+2]*=brightness}}ctx.putImageData(image,0,0)}
function load(){ctx.drawImage(texture,1247,94,70,70,0,0,608,608);try{source=ctx.getImageData(0,0,608,608);draw(phase)}catch(e){label.textContent='Moon texture unavailable';label.classList.add('error');range.disabled=true}}
texture.addEventListener('load',load);texture.addEventListener('error',()=>{label.textContent='Moon texture unavailable';label.classList.add('error');range.disabled=true});if(texture.complete&&texture.naturalWidth)load();
function stopDemo(){cancelAnimationFrame(frame)}function input(){stopDemo();draw(Number(range.value)/100);stage.dispatchEvent(new CustomEvent('moon-phase-change',{bubbles:true,detail:{phase}}))}range.addEventListener('input',input);
function point(e){const box=canvas.getBoundingClientRect();range.value=String(Math.round(Math.max(0,Math.min(1,(e.clientX-box.left)/box.width))*100));input()}
canvas.addEventListener('pointerdown',e=>{drag=true;canvas.setPointerCapture(e.pointerId);point(e)});canvas.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||drag)point(e)});canvas.addEventListener('pointerup',()=>drag=false);canvas.addEventListener('pointercancel',()=>drag=false);canvas.addEventListener('lostpointercapture',()=>drag=false);
const ease=x=>{x=Math.max(0,Math.min(1,x));return x*x*(3-2*x)};motion.addEventListener('change',()=>{if(motion.matches)stopDemo()});
if(new URLSearchParams(location.search).get('demo')==='1'&&!motion.matches){const start=performance.now();function replay(now){const t=((now-start)/1000)%6,p=t<.65?0:t<2.65?ease((t-.65)/2):t<3.15?1:t<5.2?1-ease((t-3.15)/2.05):0;draw(p);frame=requestAnimationFrame(replay)}frame=requestAnimationFrame(replay)}addEventListener('pagehide',stopDemo);
</script></html>
