<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Route marker pulse</title>
<style>
@font-face{font-family:Inter;src:url('https://raw.githubusercontent.com/kiouoi996-commits/Repixel-Previews/d4256c6ca9d175defe67e3c4965a2d1bfa0f1114/fonts/app-assets/pulse-go-next-place-2026-09-30/Inter-Latin.woff')}*{box-sizing:border-box}body{margin:0;background:#ecf2f7;min-height:100svh;display:grid;place-items:center;font-family:Inter,system-ui,sans-serif}.stage{width:1080px;height:608px;position:relative;transform-origin:center}.viewport{position:absolute;left:150px;top:39px;width:780px;height:530px;overflow:hidden;border-radius:28px}.world{position:absolute;width:416px;height:600px;left:-50px;top:-460px;transform:scale(2);transform-origin:0 0}.map,.route{position:absolute;inset:0;width:416px;pointer-events:none}.map{height:600px;object-fit:cover}.route{height:598px}.marker{position:absolute;width:65px;height:65px;padding:4px;transform:translate(-50%,-50%);border:0;border-radius:50%;background:#fff;box-shadow:0 3px 9px #213f511f;cursor:pointer;isolation:isolate}.marker img{width:100%;height:100%;object-fit:cover;border-radius:50%;pointer-events:none}.marker:focus-visible{outline:2px solid #163f82;outline-offset:5px}.marker[aria-pressed=true]{box-shadow:0 3px 9px #213f511f,0 0 0 1.5px #347eed}.ring{position:absolute;inset:0;border:1.1px solid #347eed;border-radius:50%;pointer-events:none;z-index:-1;opacity:0}.caption{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);padding:4px 11px;white-space:nowrap;background:white;border-radius:12px;color:#26354a;font-size:11px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .23s}.marker[aria-pressed=true] .caption{opacity:1;transition-delay:.25s}.anchor{position:absolute;width:13.5px;height:13.5px;transform:translate(-50%,-50%);border:2.5px solid white;border-radius:50%;background:#347eed;pointer-events:none}.status{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(prefers-reduced-motion:reduce){.caption{transition:none!important}}
</style>
<main class="stage" aria-label="Choose a route photo marker"><div class="viewport"><div class="world">
<img class="map" alt="Lake Braies route map" src="https://raw.githubusercontent.com/kiouoi996-commits/Repixel-Previews/54e0866647b4160dcaac6d0eb57e7c99e7aa74e3/images/lake-braies-travel-ui/lake-braies-map.webp">
<img class="route" alt="" src="https://raw.githubusercontent.com/kiouoi996-commits/Repixel-Previews/6610f39226bc8819144aa38cfb84007b70270b13/images/apps/alpine-explorer-mobile-2026-10-03/map-route-measured.svg">
<i class="anchor" style="left:129px;top:342px"></i><i class="anchor" style="left:183px;top:356px"></i><i class="anchor" style="left:94px;top:493px"></i><i class="anchor" style="left:343px;top:419px"></i>
<button class="marker" data-id="cabin" aria-label="Select Cabin marker" aria-pressed="false" style="left:180px;top:309px"><span class="ring"></span><span class="ring"></span><img alt="" src="https://raw.githubusercontent.com/kiouoi996-commits/Repixel-Previews/6610f39226bc8819144aa38cfb84007b70270b13/images/apps/alpine-explorer-mobile-2026-10-03/marker-cabin-visible.webp"><span class="caption">Cabin</span></button>
<button class="marker" data-id="east" aria-label="Select East marker" aria-pressed="false" style="left:345px;top:374px"><span class="ring"></span><span class="ring"></span><img alt="" src="https://raw.githubusercontent.com/kiouoi996-commits/Repixel-Previews/6610f39226bc8819144aa38cfb84007b70270b13/images/apps/alpine-explorer-mobile-2026-10-03/marker-east-visible.webp"><span class="caption">East</span></button>
<button class="marker" data-id="southwest" aria-label="Select Southwest marker" aria-pressed="false" style="left:94px;top:444px"><span class="ring"></span><span class="ring"></span><img alt="" src="https://raw.githubusercontent.com/kiouoi996-commits/Repixel-Previews/6610f39226bc8819144aa38cfb84007b70270b13/images/apps/alpine-explorer-mobile-2026-10-03/marker-southwest-visible.webp"><span class="caption">Southwest</span></button>
</div></div><p class="status" role="status" aria-live="polite"></p></main>
<script>
const stage=document.querySelector('.stage'),buttons=[...document.querySelectorAll('.marker')],motion=matchMedia('(prefers-reduced-motion: reduce)');let animations=[],timer=0,frame=0;
function fit(){stage.style.transform=`scale(${Math.min(innerWidth/1080,innerHeight/608,1)})`}addEventListener('resize',fit);fit();
function cancel(){animations.forEach(a=>a.cancel());animations=[];buttons.forEach(b=>b.querySelectorAll('.ring').forEach(r=>{r.style.opacity='0'}))}
function choose(button,notify=true){cancel();buttons.forEach(b=>b.setAttribute('aria-pressed',String(b===button)));if(!button)return;if(!motion.matches)button.querySelectorAll('.ring').forEach((r,i)=>animations.push(r.animate([{transform:'scale(1)',opacity:.75},{transform:'scale(1.74)',opacity:0}],{duration:850,delay:i*170,easing:'cubic-bezier(.22,.61,.36,1)',fill:'none'})));if(notify){document.querySelector('.status').textContent=`${button.dataset.id} marker selected`;stage.dispatchEvent(new CustomEvent('route-marker-select',{bubbles:true,detail:{id:button.dataset.id}}))}}
buttons.forEach(b=>b.addEventListener('click',()=>{stopDemo();choose(b)}));addEventListener('keydown',e=>{if(e.key==='Escape'){stopDemo();choose(null);document.querySelector('.status').textContent='Marker selection cleared'}});
function stopDemo(){clearTimeout(timer);cancelAnimationFrame(frame)}
motion.addEventListener('change',()=>{cancel();if(motion.matches)stopDemo()});
// Host handler connects route-marker-select to onMarkerOpen(id). Coordinates are display anchors.
if(new URLSearchParams(location.search).get('demo')==='1'&&!motion.matches){let start=performance.now(),last='';function replay(now){const t=((now-start)/1000)%6,key=t>=.6&&t<2.7?'cabin':t>=3.05&&t<5.15?'east':'';if(key!==last){choose(buttons.find(b=>b.dataset.id===key)||null,false);last=key}frame=requestAnimationFrame(replay)}frame=requestAnimationFrame(replay)}
addEventListener('pagehide',()=>{stopDemo();cancel()});
</script></html>
